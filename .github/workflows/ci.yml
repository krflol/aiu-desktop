name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  build-and-test:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Checkout pinned Go backend
        shell: bash
        run: |
          set -euo pipefail
          repository=$(python -c 'import json; print(json.load(open("backend.json"))["source_repository"])')
          revision=$(python -c 'import json; print(json.load(open("backend.json"))["revision"])')
          test "$revision" != PLACEHOLDER
          git clone "$repository" backend
          git -C backend fetch --depth 1 origin "$revision"
          git -C backend checkout --detach "$revision"
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libayatana-appindicator3-dev libxkbcommon-x11-0 xvfb xauth x11-utils openbox dbus-x11 xdotool wmctrl python3-gi
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-debug-${{ runner.os }}-${{ runner.arch }}-1.88-${{ hashFiles('Cargo.lock') }}
      - name: Build backend for Rust subprocess tests
        shell: bash
        run: |
          mkdir -p target/debug
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          (cd backend && go build -o "../target/debug/aiu$suffix" ./cmd/aiu)
          backend_path=$(python -c "from pathlib import Path; print(Path('target/debug/aiu$suffix').resolve())")
          echo "AIU_TEST_BACKEND=$backend_path" >> "$GITHUB_ENV"
      - run: cargo +1.88.0 fmt --all -- --check
      - run: cargo +1.88.0 test --locked --all-features
      - run: cargo +1.88.0 clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo +1.88.0 build --locked --bin aiu-desktop
      - name: Go backend tests
        shell: bash
        working-directory: backend
        run: go test ./...
      - name: Installer tests
        run: python -m pytest -q
      - name: Linux desktop smoke
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: bash scripts/test-linux-desktop.sh
